spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: court-service
              uri: ${COURT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courts,/api/courts/**
              filters:
                - StripPrefix=1

server:
  port: ${SERVER_PORT:8080}
