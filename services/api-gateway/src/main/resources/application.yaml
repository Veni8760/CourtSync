spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users,/api/users/**
              filters:
                - StripPrefix=1
            - id: court-service
              uri: ${COURT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courts,/api/courts/**
              filters:
                - StripPrefix=1
            # StripPrefix=1 drops the leading /api, so /api/drop-ins/{id}/rsvp
            # reaches dropin-service as /drop-ins/{id}/rsvp.
            - id: dropin-service
              uri: ${DROPIN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/drop-ins,/api/drop-ins/**
              filters:
                - StripPrefix=1
            - id: search-service
              uri: ${SEARCH_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/search,/api/search/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/alerts,/api/alerts/**
              filters:
                - StripPrefix=1

server:
  port: ${SERVER_PORT:8080}
