spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: court-service
              uri: ${COURT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courts,/api/courts/**
              filters:
                - StripPrefix=1
            # StripPrefix=1 drops the leading /api, so /api/drop-ins/{id}/rsvp
            # reaches dropin-service as /drop-ins/{id}/rsvp.
            - id: dropin-service
              uri: ${DROPIN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/drop-ins,/api/drop-ins/**
              filters:
                - StripPrefix=1

server:
  port: ${SERVER_PORT:8080}
