spring:
  application:
    name: search-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:search-service}
      # Events are plain JSON strings (see dropin-service producer); read them as
      # strings and parse with Jackson in the listener.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # On first run with no committed offset, start from the beginning so we
      # don't miss events published before this consumer existed.
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8087}
