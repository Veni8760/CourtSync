spring:
  application:
    name: dropin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=dropins}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres.aeojyhopmxgtzedqughe}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dropins
  flyway:
    enabled: true
    schemas: dropins
    default-schema: dropins
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # We hand-serialize event payloads to JSON strings (matching
      # shared/event-contracts/events.md so every consumer decodes the same
      # shape), so both key and value go out as plain strings.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for the broker leader to ack the write before treating send as done.
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER:https://aeojyhopmxgtzedqughe.supabase.co/auth/v1}
  # gRPC CLIENT config. "court-service" is the named channel CourtGrpcClientConfig
  # resolves via GrpcChannelFactory.createChannel("court-service").
  grpc:
    client:
      channels:
        court-service:
          address: ${COURT_GRPC_ADDRESS:static://localhost:9090}
          # Local/docker traffic is plaintext (no TLS) — gRPC defaults to TLS otherwise.
          negotiation-type: plaintext

server:
  port: ${SERVER_PORT:8083}
