# CourtSync local stack (MASTER §15).
# Hosted Supabase Postgres + local Kafka/Redis + services + frontend.
# Bring up everything:  docker compose up
# Infra only:           docker compose up kafka redis
# Optional local DB:    docker compose --profile local-db up postgres

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["local-db"]
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      POSTGRES_DB: ${POSTGRES_DB:-courtsync}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Per-service schemas are created on first start.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courtsync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      # Host port only for local CLI/debug; services reach kafka at kafka:9092 on the
      # compose network. Host-side default 9094 dodges other projects squatting 9092.
      # ponytail: env-overridable so the internal listener stays kafka:9092 untouched.
      - "${KAFKA_HOST_PORT:-9094}:9092"
    environment:
      # Single-node KRaft (no Zookeeper): this node is both broker and controller.
      # NOTE: listeners use the empty-host form (://:9092), NOT 0.0.0.0 — the
      # apache/kafka image derives advertised.listeners from these, and 0.0.0.0
      # is rejected as a non-routable advertised address. (Apache's own examples
      # use ://:port too.)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courtsync-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Search read store. Single-node, security off — LOCAL DEV ONLY. Version pinned
  # to the Elasticsearch client Spring Boot 4.0.2 manages (9.2.x) to avoid a
  # client/server mismatch. ES_JAVA_OPTS caps heap so it fits a laptop.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      COURT_SERVICE_URL: http://court-service:8082
      DROPIN_SERVICE_URL: http://dropin-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      SEARCH_SERVICE_URL: http://search-service:8087

  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_JDBC_BASE_URL:-jdbc:postgresql://db.aeojyhopmxgtzedqughe.supabase.co:5432/postgres?sslmode=require}&currentSchema=users
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env or your shell}
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-https://aeojyhopmxgtzedqughe.supabase.co/auth/v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  court-service:
    # Build context is the repo root so the Dockerfile can also COPY shared/proto
    # (the gRPC contract), which lives outside the service directory.
    build:
      context: .
      dockerfile: services/court-service/Dockerfile
    ports:
      # Host publishes are dev-only; gateway hits court-service:8082 and dropin hits
      # court-service:9090 over the compose network. Host defaults dodge port squatters.
      - "${COURT_HOST_PORT:-8092}:8082"   # REST
      - "${COURT_GRPC_HOST_PORT:-9190}:9090"   # gRPC (CourtService.GetCourt) — dropin hits court-service:9090 on the network
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_JDBC_BASE_URL:-jdbc:postgresql://db.aeojyhopmxgtzedqughe.supabase.co:5432/postgres?sslmode=require}&currentSchema=courts
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env or your shell}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  dropin-service:
    # Build context is the repo root so the Dockerfile can also COPY shared/proto
    # (the gRPC contract), which lives outside the service directory.
    build:
      context: .
      dockerfile: services/dropin-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_JDBC_BASE_URL:-jdbc:postgresql://db.aeojyhopmxgtzedqughe.supabase.co:5432/postgres?sslmode=require}&currentSchema=dropins
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env or your shell}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # gRPC address of court-service (validates court exists on drop-in creation).
      COURT_GRPC_ADDRESS: static://court-service:9090
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      court-service:
        condition: service_started

  # Player alerts: consumes dropin-events → per-user alert feed, badge count in Redis.
  notification-service:
    build: ./services/notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_JDBC_BASE_URL:-jdbc:postgresql://db.aeojyhopmxgtzedqughe.supabase.co:5432/postgres?sslmode=require}&currentSchema=notifications
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env or your shell}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-https://aeojyhopmxgtzedqughe.supabase.co/auth/v1}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Drop-in search read model: consumes dropin-events → indexes into Elasticsearch.
  search-service:
    build: ./services/search-service
    ports:
      - "8087:8087"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-https://aeojyhopmxgtzedqughe.supabase.co/auth/v1}
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build: ./services/frontend
    ports:
      # Host port configurable (default 3000); set FRONTEND_PORT in .env to avoid
      # clashing with another local app on 3000.
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      COURTSYNC_API_BASE_URL: ${COURTSYNC_API_BASE_URL:-http://api-gateway:8080/api}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://aeojyhopmxgtzedqughe.supabase.co}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      - api-gateway

volumes:
  postgres-data:
