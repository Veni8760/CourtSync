# CourtSync local stack (MASTER §15).
# Infra (postgres, kafka, redis) + 8 backend services + frontend.
# Bring up everything:  docker compose up
# Infra only:           docker compose up postgres kafka redis

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      POSTGRES_DB: ${POSTGRES_DB:-courtsync}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Per-service schemas are created on first start.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-courtsync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (no Zookeeper): this node is both broker and controller.
      # NOTE: listeners use the empty-host form (://:9092), NOT 0.0.0.0 — the
      # apache/kafka image derives advertised.listeners from these, and 0.0.0.0
      # is rejected as a non-routable advertised address. (Apache's own examples
      # use ://:port too.)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      COURT_SERVICE_URL: http://court-service:8082
      DROPIN_SERVICE_URL: http://dropin-service:8083
      MESSAGING_SERVICE_URL: http://messaging-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      SEARCH_SERVICE_URL: http://search-service:8087

  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courtsync?currentSchema=users
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  court-service:
    build: ./services/court-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courtsync?currentSchema=courts
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  dropin-service:
    build: ./services/dropin-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courtsync?currentSchema=dropins
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  messaging-service:
    build: ./services/messaging-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courtsync?currentSchema=messages
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courtsync?currentSchema=payments
      POSTGRES_USER: ${POSTGRES_USER:-courtsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtsync}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  search-service:
    build: ./services/search-service
    ports:
      - "8087:8087"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      COURTSYNC_API_BASE_URL: ${COURTSYNC_API_BASE_URL:-http://api-gateway:8080/api}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - api-gateway

volumes:
  postgres-data:
